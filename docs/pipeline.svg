<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" role="img" aria-labelledby="title desc">
<title id="title">PoomSa 형태소 분석 파이프라인</title>
<desc id="desc">입력과 교정 이후 Garu와 규칙 사전의 후보를 결합하고 문맥 판별, 학교 문법 변환, 채점과 해설로 이어진다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#596568"/></marker></defs>
<rect width="820" height="760" fill="#f7f7f3"/>
<g fill="none" stroke="#596568" stroke-width="2" marker-end="url(#arrow)">
<path d="M410 88V120"/><path d="M410 190V215H210V250"/><path d="M410 190V215H610V250"/>
<path d="M210 340V375H410V410"/><path d="M610 340V375H410"/><path d="M410 500V540"/><path d="M410 610V650"/>
</g>
<g fill="#fff" stroke="#b6c1bd" stroke-width="1.5">
<rect x="230" y="25" width="360" height="63" rx="8"/><rect x="230" y="120" width="360" height="70" rx="8"/>
<rect x="40" y="250" width="340" height="90" rx="8"/><rect x="440" y="250" width="340" height="90" rx="8"/>
<rect x="200" y="410" width="420" height="90" rx="8"/><rect x="200" y="540" width="420" height="70" rx="8"/>
<rect x="200" y="650" width="420" height="70" rx="8"/>
</g>
<g font-family="Malgun Gothic, sans-serif" fill="#233632" text-anchor="middle" font-size="18">
<text x="410" y="64">자유 문장 입력 · 원문 보관</text>
<text x="410" y="150">공백 · 등록된 맞춤법 규칙 검사</text><text x="410" y="176" font-size="14">교정문과 변경 이유 생성</text>
<text x="210" y="286">Garu 형태소 후보</text><text x="210" y="315" font-size="14">브라우저 WASM · 세종 품사 태그</text>
<text x="610" y="286">사전 · 복원 규칙 후보</text><text x="610" y="315" font-size="14">조사 분리 · 어미 분리 · 음운 역복원</text>
<text x="410" y="445">후보 결합 · 문맥 판별</text><text x="410" y="475" font-size="14">관형사형과 의존 명사 · 현재 시제 결합 · 충돌 보류</text>
<text x="410" y="570">학교 문법 단어와 형태소를 각각 구성</text><text x="410" y="595" font-size="14">어미는 용언과 함께 · 복원 형태소는 별도 표</text>
<text x="410" y="680">신뢰도에 따른 채점 · 최종 품사 해설</text><text x="410" y="705" font-size="14">최종 분류명만 표시 · 불확실한 항목은 감점 제외</text>
</g></svg>
